name: Production Build & Search Engine Auto-Indexing

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate TypeScript & Build Production Bundle
        run: npm run build

      - name: Trigger Instant Search Engine IndexNow Submissions
        run: |
          node scripts/indexnow-submit.js || true
          node scripts/google-indexing-api.js || true

      - name: Ping Google & Bing Search Engines
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://www.saheeluxton.in/sitemap.xml" || true
          curl -s "https://www.bing.com/ping?sitemap=https://www.saheeluxton.in/sitemap.xml" || true

      - name: Setup GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
